<title>Projekt-Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: instrument cluster on top (main gauge + warning lamps + briefing), today + deadlines, calendar (month + day agenda), project gauges in a wrapping grid */
:root{
  --bg:#eef1f0; --panel:#ffffff; --panel-2:#f6f8f7; --line:#d5dbd9; --fg:#15191b; --muted:#5c6764;
  --accent:#d97a00; --accent-soft:rgba(217,122,0,.14);
  --ok:#1f9d63; --warn:#b58800; --crit:#d63a2f; --pause:#66778a; --info:#2f6fd6; --own:#8350c8;
  --track:#e1e6e4; --tick:#8c9794; --shadow:0 10px 30px rgba(15,18,20,.16);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1214; --panel:#171b1e; --panel-2:#13171a; --line:#2a3034; --fg:#e7ecea; --muted:#8b9692;
  --accent:#ff9f1a; --accent-soft:rgba(255,159,26,.16);
  --ok:#3ecf8e; --warn:#f5c542; --crit:#ff5a4e; --pause:#8695a6; --info:#6ea8ff; --own:#b48cff;
  --track:#252b2f; --tick:#5d6866; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1214; --panel:#171b1e; --panel-2:#13171a; --line:#2a3034; --fg:#e7ecea; --muted:#8b9692;
  --accent:#ff9f1a; --accent-soft:rgba(255,159,26,.16);
  --ok:#3ecf8e; --warn:#f5c542; --crit:#ff5a4e; --pause:#8695a6; --info:#6ea8ff; --own:#b48cff;
  --track:#252b2f; --tick:#5d6866; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:20px 64px;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2rem;line-height:1.1}
h2{font-size:1.35rem;text-transform:uppercase;letter-spacing:.06em}
h3{font-size:1.2rem;line-height:1.2}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.1em;font-size:.8rem;color:var(--muted);font-weight:600}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Top bar */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px}
.top .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;align-items:center}
.save{font-size:.78rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.save.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.save.local{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}

/* Cluster */
.cluster{display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.cluster .main-gauge{display:flex;flex-direction:column;align-items:center;gap:4px}
.cluster-right{display:flex;flex-direction:column;gap:18px;min-width:0}
.lamps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.lamp{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);text-align:left;cursor:pointer}
.lamp:hover{border-color:var(--tick)}
.lamp .dot{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;font-size:.9rem;background:var(--track);color:var(--muted)}
.lamp.on .dot{color:var(--bg);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent),0 0 14px color-mix(in srgb,var(--c) 55%,transparent);background:var(--c)}
.lamp .lbl{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.07em;font-size:.82rem;font-weight:600;line-height:1.2}
.lamp .sub{font-size:.75rem;color:var(--muted)}
.headline{font-size:1.08rem;line-height:1.45;max-width:70ch;margin:0}

/* Panels */
.briefing{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0;display:flex;flex-direction:column;gap:12px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.prio{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:.68rem;font-weight:700;padding:1px 7px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.prio.hoch{color:var(--crit)} .prio.mittel{color:var(--warn)} .prio.niedrig{color:var(--muted)}
.dl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.dl li{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:baseline}
.dl li:first-child{border-top:0}
.dl .d{font-family:var(--f-mono);font-size:.85rem}
.left{font-family:var(--f-mono);font-size:.78rem;padding:1px 7px;border-radius:6px;background:var(--track);color:var(--muted);white-space:nowrap}
.left.soon{background:var(--accent-soft);color:var(--accent)}
.left.now{background:color-mix(in srgb,var(--crit) 18%,transparent);color:var(--crit)}

/* Tasks (checkbox · text · actions) */
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:start;padding:7px 0;border-top:1px solid var(--line)}
.tasks.flush .task:first-child{border-top:0}
.task input[type=checkbox]{width:18px;height:18px;margin:3px 0 0;accent-color:var(--ok);cursor:pointer}
.task .t{font-size:.92rem;min-width:0;overflow-wrap:anywhere}
.task .t small{display:block;font-size:.76rem;color:var(--muted)}
.task.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 70%,transparent)}
.task .badge{display:inline-block;font-family:var(--f-mono);font-size:.7rem;padding:0 6px;border-radius:5px;margin-right:6px;background:color-mix(in srgb,var(--info) 16%,transparent);color:var(--info);text-decoration:none}
.acts{display:flex;gap:2px}
.ib{width:28px;height:28px;display:grid;place-items:center;border:0;background:transparent;border-radius:7px;cursor:pointer;color:var(--muted)}
.ib:hover{background:var(--track);color:var(--fg)}
.ib svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.snoozed-note{font-size:.8rem;color:var(--muted);padding-top:6px}
.snoozed-note button{border:0;background:none;color:var(--info);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}

/* Calendar */
.cal{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:16px}
.cal-nav{display:flex;gap:6px;align-items:center}
.cal-nav button,.chip,select,.btn{font-size:.85rem;padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.cal-nav .ttl{font-family:var(--f-display);font-weight:600;font-size:1.15rem;min-width:9.5em;text-align:center}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--c)}
.grid-wrap{overflow-x:auto}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);min-width:420px}
.month .wd{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:.72rem;color:var(--muted);padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel-2)}
.day{min-height:92px;padding:5px 6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;background:var(--panel);border-top:0;border-left:0;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.day:hover{background:var(--panel-2)}
.day.out{background:var(--panel-2);color:var(--muted)}
.day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.day .n{font-family:var(--f-mono);font-size:.8rem;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.day.today .n{background:var(--accent);color:var(--bg);font-weight:500}
.ev{font-size:.72rem;line-height:1.3;padding:1px 5px;border-radius:4px;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.more{font-size:.7rem;color:var(--muted);font-family:var(--f-mono)}
.agenda h3{font-size:1.15rem}
.ag{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ag li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.ag li:first-child{border-top:0}
.ag .tm{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);padding-top:2px}
.ag .k{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:6px}
.ag .sub{font-size:.78rem;color:var(--muted)}
.ag a{color:var(--info)}
.ag .task{border-top:0;padding:0;grid-template-columns:22px minmax(0,1fr) auto}
.cal-status{font-size:.78rem;color:var(--muted)}

/* Toolbar + cards */
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .n{font-family:var(--f-mono);font-size:.75rem;opacity:.7;margin-left:4px}
.sortlbl{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.blocked{border-color:color-mix(in srgb,var(--crit) 55%,var(--line))}
.card .head{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;align-items:center}
.card .who{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.src{font-family:var(--f-mono);font-size:.7rem;padding:0 6px;border-radius:4px;border:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.07em;font-size:.75rem;font-weight:600;margin-top:6px}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.card p{margin:0;font-size:.92rem}
.card details{border-top:1px solid var(--line);padding-top:8px}
.card summary{cursor:pointer;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.07em;font-size:.82rem;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
.card summary::-webkit-details-marker{display:none}
.card summary::after{content:"+";font-family:var(--f-mono)}
.card details[open] summary::after{content:"–"}
.card details .tasks{margin-top:4px}
.card details .task:first-child{border-top:0}
.note{font-size:.8rem;color:var(--muted)}
.foot{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

/* Toolbar: search + refresh (sticky) */
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);padding-block:10px;margin-block:-10px}
.searchbox{flex:1 1 320px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 10px;min-width:0}
.searchbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.searchbox svg{width:18px;height:18px;flex:none;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round}
.searchbox input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;font-size:.95rem;padding:9px 0;outline:none}
.searchbox kbd{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.refresh{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:500}
.refresh:hover{border-color:var(--tick)}
.refresh svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.refresh[aria-busy="true"] svg{animation:spin 1s linear infinite}
.refresh[aria-busy="true"]{opacity:.75;cursor:progress}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.refresh[aria-busy="true"] svg{animation:none}}
.refreshed{font-size:.78rem}
mark{background:color-mix(in srgb,var(--accent) 30%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.res-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.res-list li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px solid var(--line);align-items:baseline}
.res-list li:first-child{border-top:0}
.res-list .d{font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
.res-list button{border:0;background:none;padding:0;text-align:left;cursor:pointer;color:inherit}
.res-list button:hover{color:var(--accent)}
.card.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.res-list .ctx{display:block;font-size:.8rem;color:var(--muted)}
.state{font-family:var(--f-mono);font-size:.68rem;padding:0 5px;border-radius:4px;border:1px solid var(--line);margin-left:6px;color:var(--muted)}
.det{font-size:.88rem;margin:6px 0 0}
.srcs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.srcs span{font-size:.72rem;padding:1px 7px;border-radius:99px;background:var(--track);color:var(--muted)}
.res-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px 24px}

/* Own calendar entries: form */
.modal-bg{position:fixed;inset:0;z-index:40;background:rgba(10,12,14,.45);display:grid;place-items:center;padding:16px}
.modal{width:min(440px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.modal label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
.modal input[type=text],.modal input[type=date],.modal input[type=time],.modal select,.modal textarea{font:inherit;font-size:.95rem;color:var(--fg);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
.modal textarea{min-height:70px;resize:vertical}
.modal .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .chk{flex-direction:row;align-items:center;gap:8px;color:var(--fg)}
.modal .row{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.ag-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ag .own{border:0;background:none;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.ag .own:hover{color:var(--own)}

/* Popover + toast */
.pop{position:fixed;z-index:20;width:260px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px}
.pop .row{display:flex;gap:6px;flex-wrap:wrap}
.pop .btn{border-radius:8px;padding:5px 10px}
.pop .btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pop input[type=date]{font:inherit;font-size:.9rem;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 14px;display:flex;gap:14px;align-items:center;font-size:.9rem;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.toast button{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0}

/* Gauge */
.gauge{display:block;width:100%;height:auto}
.gauge .trk{fill:none;stroke:var(--track)}
.gauge .val{fill:none;stroke:var(--accent);stroke-linecap:round}
.gauge .goal{fill:none;stroke:var(--ok);opacity:.85}
.gauge .tk{stroke:var(--tick)}
.gauge .tk.maj{stroke:var(--fg)}
.gauge .lb{fill:var(--muted);font-family:var(--f-mono);font-size:10px;text-anchor:middle;dominant-baseline:middle}
.gauge .num{fill:var(--fg);font-family:var(--f-mono);font-weight:500;text-anchor:middle}
.gauge .unit{fill:var(--muted);font-family:var(--f-display);text-anchor:middle;letter-spacing:.1em;text-transform:uppercase}
.gauge .needle{transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
.gauge .ndl{stroke:var(--crit);stroke-linecap:round}
.gauge .hub{fill:var(--fg)}
.gauge .hub2{fill:var(--panel)}
@media (prefers-reduced-motion: reduce){.gauge .needle{transition:none}}

@media (max-width:900px){
  .cluster,.briefing,.cal{grid-template-columns:1fr}
  .cluster .main-gauge{max-width:280px;margin:0 auto;width:100%}
  .lamps{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:600px){
  .day{min-height:58px}
  .ev{font-size:0;padding:0;height:5px;border-left-width:0;background:var(--c)}
}
@media (max-width:420px){
  .card .head{grid-template-columns:96px minmax(0,1fr)}
}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" id="owner">Alle Projekte</div>
      <h1>Projekt-Cockpit</h1>
    </div>
    <div class="meta muted">
      <span id="today"></span>
      <span>Datenstand <span class="mono" id="updated">–</span></span>
      <span class="save" id="saveMode" hidden></span>
      <span class="save" id="olPill" hidden></span>
      <button type="button" class="save" id="olFix" hidden style="cursor:pointer;background:var(--panel)">Outlook freigeben</button>
    </div>
  </header>

  <div class="toolbar" role="search">
    <label class="searchbox" for="q">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input type="search" id="q" placeholder="Suchen in Projekten, Aufgaben, Fristen und Terminen" aria-label="Suchen" autocomplete="off" spellcheck="false">
      <kbd aria-hidden="true">/</kbd>
    </label>
    <span class="mono muted" id="qCount" aria-live="polite"></span>
    <button type="button" class="refresh" id="refreshBtn" title="Daten, Häkchen und Kalender neu laden">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      Aktualisieren
    </button>
    <span class="muted refreshed" id="refreshedAt" title="Automatische Aktualisierung alle 15 Minuten"></span>
  </div>

  <section class="panel" id="results" hidden aria-label="Suchergebnisse">
    <div class="panel-head"><h2>Suchergebnisse</h2><button type="button" class="btn" id="qClear">Suche löschen</button></div>
    <div class="res-cols" id="resCols"></div>
  </section>

  <section class="cluster" aria-label="Gesamtübersicht">
    <div class="main-gauge">
      <div id="mainGauge" style="width:100%"></div>
      <div class="eyebrow">Ø Fortschritt aktiver Projekte</div>
    </div>
    <div class="cluster-right">
      <div class="lamps" id="lamps"></div>
      <div>
        <div class="eyebrow">Tagesbriefing</div>
        <p class="headline" id="headline">Daten werden geladen …</p>
      </div>
    </div>
  </section>

  <section class="briefing" aria-label="Tagesbriefing">
    <div class="panel">
      <div class="panel-head"><h2>Heute wichtig</h2><span class="mono muted" id="todoCount"></span></div>

  <section class="panel" id="calendar" aria-label="Kalender">
    <div class="panel-head">
      <h2>Kalender</h2>
      <div class="cal-nav">
        <button type="button" id="calPrev" aria-label="Vorheriger Monat">‹</button>
        <span class="ttl" id="calTitle"></span>
        <button type="button" id="calNext" aria-label="Nächster Monat">›</button>
        <button type="button" id="calToday">Heute</button>
      </div>
    </div>
    <div class="legend">
      <span><i style="--c:var(--info)"></i>Outlook-Termin</span>
      <span><i style="--c:var(--accent)"></i>Frist</span>
      <span><i style="--c:var(--ok)"></i>Wiedervorlage</span>
      <span><i style="--c:var(--own)"></i>Eigener Termin</span>
      <span class="cal-status" id="calStatus"></span>
    </div>
    <div class="cal">
      <div class="grid-wrap"><div class="month" id="month"></div></div>
      <div class="agenda" id="agenda"></div>
    </div>
  </section>

  <section aria-label="Projekte" style="display:flex;flex-direction:column;gap:14px">
    <div class="bar">
      <h2>Projekte <span class="mono muted" id="count" style="font-size:.9rem"></span></h2>
      <label class="sortlbl" for="sort">Sortieren
        <select id="sort">
          <option value="status">nach Dringlichkeit</option>
          <option value="progress">nach Fortschritt</option>
          <option value="activity">nach letzter Aktivität</option>
        </select>
      </label>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Nach Firma filtern"></div>
    <div class="chips" id="schips" role="group" aria-label="Nach Status filtern"></div>

<div class="pop" id="pop" hidden role="dialog" aria-label="Wiedervorlage"></div>
<div class="toast" id="toast" hidden role="status"></div>
<div class="modal-bg" id="evModal" hidden><form class="modal" id="evForm" role="dialog" aria-modal="true" aria-labelledby="evTitle"></form></div>

<script>
/* ---------- constants & helpers ---------- */
const STATUS = {
  "blocked":  {label:"Blockiert", c:"var(--crit)",  rank:0},
  "at-risk":  {label:"Gefährdet", c:"var(--warn)",  rank:1},
  "on-track": {label:"Im Plan",   c:"var(--ok)",    rank:2},
  "paused":   {label:"Pausiert",  c:"var(--pause)", rank:3},
  "done":     {label:"Erledigt",  c:"var(--ok)",    rank:4}
};
const ICON = {
  clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2"/><path d="M5 4 3 6M19 4l2 2"/></svg>',
  trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>'
};
const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const today0 = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
const todayISO = () => iso(today0());
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const daysFrom = s => Math.round((pd(s) - today0()) / 864e5);
const fmtD = s => pd(s).toLocaleDateString("de-DE", {day:"2-digit", month:"2-digit"});
const fmtLong = s => pd(s).toLocaleDateString("de-DE", {weekday:"long", day:"numeric", month:"long"});
function ago(s){ const d = -daysFrom(s); return d<=0 ? "heute" : d===1 ? "gestern" : `vor ${d} Tagen`; }
const norm = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const search = {q:"", terms:[], events:[], status:"idle", timer:null, seq:0};
function setQuery(q){ search.q = q.trim(); search.terms = norm(search.q).split(/\s+/).filter(t => t.length >= 2); }
const qOn = () => search.terms.length > 0;
const projText = p => [p.name, p.company, p.source, p.summary, p.progressNote, p.details, p.sources, p.nextSteps, p.openItems, (STATUS[p.status]||{}).label, p.lastActivity, fmtD(p.lastActivity)].flat().filter(Boolean);
function snippet(text){
  const src = String(text||""), n = norm(src); let i = -1;
  for (const t of search.terms){ const j = n.indexOf(t); if (j !== -1 && (i === -1 || j < i)) i = j; }
  if (i === -1) return hl(src.length > 140 ? src.slice(0,140)+"…" : src);
  const a = Math.max(0, i - 50), b = Math.min(src.length, i + 90);
  return (a>0?"…":"") + hl(src.slice(a,b)) + (b<src.length?"…":"");
}
function bestField(p){
  const fields = [["Name",p.name],["Stand",p.summary],["Details",p.details],["Nächste Schritte",(p.nextSteps||[]).join(" · ")],["Offene Punkte",(p.openItems||[]).join(" · ")],["Fortschritt",p.progressNote],["Quellen",(p.sources||[]).join(" · ")],["Firma",p.company]];
  for (const [l,v] of fields) if (v && search.terms.some(t => norm(v).includes(t))) return [l, v];
  return ["", p.summary];
}
function matches(...parts){ if (!qOn()) return true; const hay = norm(parts.flat().join(" ")); return search.terms.every(t => hay.includes(t)); }
function hl(text){
  const out = esc(text); if (!qOn()) return out;
  const src = String(text ?? ""), n = norm(src); const marks = [];
  for (const t of search.terms){ let i = 0; while ((i = n.indexOf(t, i)) !== -1){ marks.push([i, i + t.length]); i += t.length; } }
  if (!marks.length || n.length !== src.length) return out;
  marks.sort((a,b)=>a[0]-b[0]); const merged = [];
  for (const m of marks){ const last = merged.at(-1); if (last && m[0] <= last[1]) last[1] = Math.max(last[1], m[1]); else merged.push([...m]); }
  let res = "", pos = 0; for (const [a,b] of merged){ res += esc(src.slice(pos,a)) + "<mark>" + esc(src.slice(a,b)) + "</mark>"; pos = b; }
  return res + esc(src.slice(pos));
}
function hash(s){ let h = 5381; for (const ch of s) h = ((h << 5) + h + ch.codePointAt(0)) >>> 0; return h.toString(36); }
const keyFor = (pid, text) => `${String(pid||"x").replace(/[^A-Za-z0-9_\-]/g,"")}~${hash(text)}`.slice(0,200);

const ui = {company:"Alle", status:null, sort:"status", open:{}};
try{ const s = JSON.parse(localStorage.getItem("cockpit-ui")||"{}"); ui.company = s.company||"Alle"; ui.sort = s.sort||"status"; ui.open = s.open||{}; }catch(e){}
function saveUI(){ try{ localStorage.setItem("cockpit-ui", JSON.stringify({company:ui.company, sort:ui.sort, open:ui.open})); }catch(e){} }

const state = {data:null, items:{}, events:{}, cal:{y:today0().getFullYear(), m:today0().getMonth(), sel:todayISO()}, outlook:{status:"idle", byMonth:{}}};

/* ---------- task state store: shared db (preferred) or this-device fallback ---------- */
const store = {
  mode:"local", col:null, db:null,
  ref(k){ return (this.col && typeof this.col.doc === "function") ? this.col.doc(k) : this.db.doc("items/" + k); },
  loadLocal(){ try{ state.items = JSON.parse(localStorage.getItem("cockpit-items")||"{}"); }catch(e){ state.items = {}; } },
  saveLocal(){ try{ localStorage.setItem("cockpit-items", JSON.stringify(state.items)); }catch(e){} },
  async set(key, rec){
    state.items[key] = rec; renderAll();
    if (this.mode==="db"){ try{ await this.ref(key).set(rec); return; }catch(e){ console.warn("db set", e); this.fallback(); } }
    this.saveLocal();
  },
  async remove(key){
    delete state.items[key]; renderAll();
    if (this.mode==="db"){ try{ await this.ref(key).delete(); return; }catch(e){ console.warn("db delete", e); this.fallback(); } }
    this.saveLocal();
  },
  fallback(){ this.mode = "local"; this.saveLocal(); showSaveMode(); }
};
function readDocs(snap){
  const out = {}; const list = snap?.docs ?? (Array.isArray(snap) ? snap : []);
  for (const d of list){
    const id = d.id ?? d.doc_id; const data = typeof d.data === "function" ? d.data() : (d.data ?? d);
    if (id && data) out[id] = data;
  }
  return out;
}
function showSaveMode(){
  const el = $("#saveMode"); el.hidden = false;
  if (store.mode === "db"){ el.className = "save ok"; el.textContent = "Häkchen werden geräteübergreifend gespeichert"; }
  else { el.className = "save local"; el.textContent = "Häkchen nur auf diesem Gerät gespeichert"; }
}
store.loadLocal();

/* ---------- own calendar entries (db collection "events", fallback this device) ---------- */
const evStore = {
  mode:"local", col:null, db:null,
  ref(id){ return (this.col && typeof this.col.doc === "function") ? this.col.doc(id) : this.db.doc("events/" + id); },
  loadLocal(){ try{ state.events = JSON.parse(localStorage.getItem("cockpit-events")||"{}"); }catch(e){ state.events = {}; } },
  saveLocal(){ try{ localStorage.setItem("cockpit-events", JSON.stringify(state.events)); }catch(e){} },
  async set(id, rec){ state.events[id] = rec; renderCalendar(); renderResults();
    if (this.mode==="db"){ try{ await this.ref(id).set(rec); return; }catch(e){ console.warn("events set", e); this.mode="local"; } } this.saveLocal(); },
  async remove(id){ delete state.events[id]; renderCalendar(); renderResults();
    if (this.mode==="db"){ try{ await this.ref(id).delete(); return; }catch(e){ console.warn("events delete", e); this.mode="local"; } } this.saveLocal(); }
};
evStore.loadLocal();
const newId = () => "ev-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,7);
let evReturnFocus = null;
function openEventForm(id, date){
  const ev = id ? state.events[id] : null, f = $("#evForm");
  const projects = (state.data?.projects||[]).slice().sort((a,b)=>(a.company+a.name).localeCompare(b.company+b.name));
  const v = ev || {title:"", date: date || todayISO(), endDate:"", allDay:false, time:"09:00", endTime:"10:00", project:"", note:""};
  f.innerHTML = `<h3 id="evTitle">${ev ? "Termin bearbeiten" : "Neuer Termin"}</h3>
    <label for="evT">Titel<input type="text" id="evT" required maxlength="140" value="${esc(v.title)}" placeholder="z. B. Treffen Krewelshof"></label>
    <div class="two"><label for="evD">Datum<input type="date" id="evD" required value="${esc(v.date)}"></label><label for="evDE">bis (optional)<input type="date" id="evDE" value="${esc(v.endDate||"")}"></label></div>
    <label class="chk" for="evAll"><input type="checkbox" id="evAll" ${v.allDay?"checked":""}> Ganztägig</label>
    <div class="two" id="evTimes" ${v.allDay?"hidden":""}><label for="evS">Von<input type="time" id="evS" value="${esc(v.time||"")}"></label><label for="evE">Bis<input type="time" id="evE" value="${esc(v.endTime||"")}"></label></div>
    <label for="evP">Projekt (optional)<select id="evP"><option value="">– kein Projekt –</option>${projects.map(p=>`<option value="${esc(p.id)}" ${p.id===v.project?"selected":""}>${esc(p.company+" · "+p.name)}</option>`).join("")}</select></label>
    <label for="evN">Notiz (optional)<textarea id="evN" maxlength="1000">${esc(v.note||"")}</textarea></label>
    <p class="note">Wird im Cockpit gespeichert, nicht in Outlook.</p>
    <div class="row"><div>${ev ? `<button type="button" class="btn danger" id="evDel">Löschen</button>` : ""}</div><div style="display:flex;gap:8px"><button type="button" class="btn" id="evCancel">Abbrechen</button><button type="submit" class="btn primary">Speichern</button></div></div>`;
  evReturnFocus = document.activeElement;
  $("#evModal").hidden = false; $("#evT").focus();
  $("#evAll").onchange = e => { $("#evTimes").hidden = e.target.checked; };
  $("#evCancel").onclick = closeEventForm;
  if (ev) $("#evDel").onclick = () => { const prev = state.events[id]; closeEventForm(); evStore.remove(id); showToast("Termin gelöscht", () => evStore.set(id, prev)); };
  f.onsubmit = e => {
    e.preventDefault();
    const title = $("#evT").value.trim(), date = $("#evD").value;
    if (!title){ $("#evT").focus(); return; } if (!date){ $("#evD").focus(); return; }
    const endDate = $("#evDE").value && $("#evDE").value > date ? $("#evDE").value : "";
    const rec = {title, date, endDate, allDay:$("#evAll").checked, time:$("#evAll").checked ? "" : $("#evS").value, endTime:$("#evAll").checked ? "" : $("#evE").value, project:$("#evP").value, note:$("#evN").value.trim(), at:new Date().toISOString()};
    const key = id || newId(); closeEventForm(); evStore.set(key, rec);
    const d = pd(date); state.cal = {y:d.getFullYear(), m:d.getMonth(), sel:date}; renderCalendar(); loadOutlook();
    showToast(id ? "Termin gespeichert" : `Termin am ${fmtD(date)} angelegt`);
  };
}
function closeEventForm(){ $("#evModal").hidden = true; if (evReturnFocus && evReturnFocus.focus) evReturnFocus.focus(); }
document.addEventListener("click", e => {
  const n = e.target.closest("[data-evnew]"); if (n){ openEventForm(null, n.dataset.evnew); return; }
  const ed = e.target.closest("[data-evedit]"); if (ed){ openEventForm(ed.dataset.evedit); return; }
  if (e.target.id === "evModal") closeEventForm();
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#evModal").hidden) closeEventForm(); });
document.addEventListener("dblclick", e => { const day = e.target.closest(".day"); if (day) openEventForm(null, day.dataset.day); });

/* ---------- gauge ---------- */
function gauge(v, {big=false}={}){
  v = Math.max(0, Math.min(100, Number(v)||0));
  const cx=100, cy=100, A0=135, SW=270;
  const P = (deg, rad) => { const a = deg*Math.PI/180; return [cx + rad*Math.cos(a), cy + rad*Math.sin(a)]; };
  const arc = (from, to, rad) => { const [x1,y1]=P(A0+SW*from/100,rad), [x2,y2]=P(A0+SW*to/100,rad); const large = SW*(to-from)/100 > 180 ? 1 : 0; return `M${x1.toFixed(2)} ${y1.toFixed(2)} A${rad} ${rad} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`; };
  let ticks = "";
  for(let i=0;i<=100;i+=5){
    const maj = i%10===0, a = A0+SW*i/100;
    const [x1,y1]=P(a, maj?68:72), [x2,y2]=P(a, 77);
    ticks += `<line class="tk${maj?" maj":""}" x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" stroke-width="${maj?2:1}"/>`;
    if(i%20===0 && big){ const [lx,ly]=P(a,56); ticks += `<text class="lb" x="${lx.toFixed(2)}" y="${ly.toFixed(2)}">${i}</text>`; }
    else if(i===50 && !big){ const [lx,ly]=P(a,57); ticks += `<text class="lb" x="${lx.toFixed(2)}" y="${ly.toFixed(2)}" style="font-size:12px">${i}</text>`; }
  }
  const [nx,ny] = P(A0, 70);
  return `<svg class="gauge" viewBox="0 0 200 172" role="img" aria-label="Fortschritt ${Math.round(v)} Prozent">
    <path class="trk" d="${arc(0,100,84)}" stroke-width="${big?7:9}"/>
    <path class="goal" d="${arc(90,100,84)}" stroke-width="${big?7:9}"/>
    ${v>0.5?`<path class="val" d="${arc(0,v,84)}" stroke-width="${big?7:9}"/>`:""}
    ${ticks}
    <g class="needle" data-rot="${(SW*v/100).toFixed(2)}" style="transform-origin:${cx}px ${cy}px;transform:rotate(0deg)">
      <line class="ndl" x1="${cx}" y1="${cy}" x2="${nx.toFixed(2)}" y2="${ny.toFixed(2)}" stroke-width="${big?3:4}"/>
    </g>
    <circle class="hub" cx="${cx}" cy="${cy}" r="${big?7:9}"/><circle class="hub2" cx="${cx}" cy="${cy}" r="${big?3:4}"/>
    <text class="num" x="${cx}" y="${big?163:156}" style="font-size:${big?28:36}px">${Math.round(v)}<tspan class="unit" style="font-size:${big?13:16}px" dx="2">%</tspan></text>
  </svg>`;
}
let needlesSpun = false;
function spinNeedles(){
  const apply = () => document.querySelectorAll(".needle").forEach(n => n.style.transform = `rotate(${n.dataset.rot}deg)`);
  if (needlesSpun){ document.querySelectorAll(".needle").forEach(n => { n.style.transition = "none"; }); apply(); return; }
  needlesSpun = true; requestAnimationFrame(()=>requestAnimationFrame(apply));
}

/* ---------- task model ---------- */
function taskInfo(pid, text){
  const key = keyFor(pid, text), rec = state.items[key];
  let st = "open";
  if (rec){
    if (rec.state === "done") st = "done";
    else if (rec.state === "deleted") st = "deleted";
    else if (rec.state === "snoozed") st = (rec.until && rec.until > todayISO()) ? "snoozed" : "due";
  }
  return {key, pid, text, rec, st};
}
function taskLi(t, extra=""){
  const wv = t.st === "due" ? `<span class="badge">WV ${fmtD(t.rec.until)}</span>` : "";
  return `<li class="task ${t.st==="done"?"done":""}" data-key="${t.key}">
    <input type="checkbox" ${t.st==="done"?"checked":""} data-act="toggle" data-key="${t.key}" data-pid="${esc(t.pid)}" data-text="${esc(t.text)}" aria-label="Erledigt: ${esc(t.text)}">
    <span class="t">${wv}${hl(t.text)}${extra}</span>
    <span class="acts">
      <button type="button" class="ib" title="Wiedervorlage" aria-label="Wiedervorlage" data-act="snooze" data-key="${t.key}" data-pid="${esc(t.pid)}" data-text="${esc(t.text)}">${ICON.clock}</button>
      <button type="button" class="ib" title="Löschen" aria-label="Löschen" data-act="delete" data-key="${t.key}" data-pid="${esc(t.pid)}" data-text="${esc(t.text)}">${ICON.trash}</button>
    </span>
  </li>`;
}
function taskList(pid, texts, extraFn){
  const infos = (texts||[]).map(x => taskInfo(pid, x));
  const vis = infos.filter(t => t.st==="open" || t.st==="due" || t.st==="done");
  vis.sort((a,b) => (a.st==="done") - (b.st==="done"));
  const snoozed = infos.filter(t => t.st==="snoozed");
  return {
    html: vis.map(t => taskLi(t, extraFn ? extraFn(t) : "")).join(""),
    open: vis.filter(t => t.st!=="done").length, total: vis.length, snoozed
  };
}
function snoozedNote(list){
  if (!list.length) return "";
  const first = list.slice().sort((a,b)=>a.rec.until.localeCompare(b.rec.until))[0];
  return `<div class="snoozed-note">${list.length} auf Wiedervorlage, nächste am ${fmtD(first.rec.until)} · <button type="button" data-act="showWV" data-date="${first.rec.until}">im Kalender zeigen</button></div>`;
}

/* ---------- render ---------- */
function renderAll(){ if (!state.data) return; renderTop(); renderBriefing(); renderCalendar(); renderProjects(); renderResults(); }

/* ---------- search results panel (Outlook search + Wiedervorlagen + counts) ---------- */
function renderResults(){
  const box = $("#results");
  if (!qOn() || !state.data){ box.hidden = true; $("#qCount").textContent = ""; return; }
  const D = state.data, byId = Object.fromEntries(D.projects.map(p=>[p.id,p]));
  const projs = D.projects.filter(p => matches(projText(p)));
  const nProj = projs.length;
  const tasks = [];
  for (const p of D.projects) for (const t of [...(p.nextSteps||[]), ...(p.openItems||[])]) if (matches(t, p.name, p.company)) { const ti = taskInfo(p.id, t); if (ti.st !== "deleted") tasks.push({p, t, st:ti.st, rec:ti.rec}); }
  for (const it of D.briefing.items) if (matches(it.text, byId[it.project]?.name)) { const ti = taskInfo(it.project, it.text); if (ti.st !== "deleted" && !tasks.some(x => x.t === it.text)) tasks.push({p: byId[it.project], t: it.text, st: ti.st, rec: ti.rec}); }
  const dls = (D.briefing.deadlines||[]).filter(d => matches(d.text, byId[d.project]?.name));
  const wvs = Object.entries(state.items).filter(([k,r]) => r.state==="snoozed" && matches(r.text, byId[r.project]?.name));
  const own = Object.entries(state.events).filter(([id,e]) => e && matches(e.title, e.note, byId[e.project]?.name)).map(([id,e]) => ({id, ...e})).sort((a,b)=>a.date.localeCompare(b.date));
  const evs = [...own.map(e=>({subject:e.title, startDate:e.date, startTime:e.time, allDay:e.allDay, own:true})), ...search.events];
  $("#qCount").textContent = `${nProj} Projekte · ${tasks.length} Aufgaben · ${dls.length} Fristen · ${evs.length} Termine`;
  const evList = evs.length ? `<ul class="res-list">${evs.map(e=>`<li><span class="d">${fmtD(e.startDate)}${e.startDate.slice(0,4)!==String(today0().getFullYear())?"."+e.startDate.slice(2,4):""}</span><button type="button" data-goto="${e.startDate}">${hl(e.subject)}<span class="note"> · ${e.own?"eigener Termin · ":""}${e.allDay?"ganztägig":esc(e.startTime||"")}</span></button></li>`).join("")}</ul>` : "";
  const evNote = search.status==="loading" ? `<p class="note">Outlook wird durchsucht …</p>`
    : search.status==="off" ? `<p class="note">Outlook-Suche nicht verfügbar.</p>`
    : evs.length ? "" : `<p class="note">Keine Termine gefunden.</p>`;
  const evHtml = evList + evNote;
  const list = (arr, fn) => arr.length ? `<ul class="res-list">${arr.map(fn).join("")}</ul>` : `<p class="note">Keine Treffer.</p>`;

function searchOutlook(){
  clearTimeout(search.timer);
  if (!qOn()){ search.events = []; search.status = "idle"; return; }
  if (!mcp){ search.status = "off"; renderResults(); return; }
  const my = ++search.seq; search.status = "loading"; renderResults();
  search.timer = setTimeout(async () => {
    try{
      const res = await callOutlook({query: search.q, limit: 25, offset: 0});
      if (my !== search.seq) return;
      const objs = []; collectObjects(res, objs); const seen = new Set();
      search.events = objs.filter(o => o.subject && o.start && !o.isCancelled && !hiddenEvent(o.subject)).map(o => {
        const sdt = String(o.start.dateTime||""); return {subject:o.subject, startDate:sdt.slice(0,10), startTime:sdt.slice(11,16), allDay:!!o.isAllDay};
      }).filter(e => { const k = e.subject+e.startDate+e.startTime; if (seen.has(k)) return false; seen.add(k); return true; })
        .sort((a,b) => Math.abs(pd(a.startDate)-today0()) - Math.abs(pd(b.startDate)-today0()));
      search.status = "ok";
    }catch(e){ if (my === search.seq){ search.events = []; search.status = "off"; } }
    if (my === search.seq) renderResults();
  }, 450);
}

/* ---------- refresh: every data source registers via onRefresh() (future features too) ---------- */
const AUTO_REFRESH_MIN = 15;
const refreshers = [];
function onRefresh(name, fn){ refreshers.push({name, fn}); }
let lastRefresh = null, autoTimer = null;
async function refreshAll({quiet=false}={}){
  const btn = $("#refreshBtn"); if (btn.getAttribute("aria-busy")==="true") return;
  btn.setAttribute("aria-busy","true");
  const res = await Promise.allSettled(refreshers.map(r => Promise.resolve().then(r.fn)));
  btn.setAttribute("aria-busy","false");
  lastRefresh = new Date(); stampRefresh(); scheduleAuto();
  renderAll();
  const failed = res.map((r,i)=>r.status==="rejected" ? refreshers[i].name : null).filter(Boolean);
  if (!quiet || failed.length) showToast(failed.length ? `Aktualisiert, nicht erreichbar: ${failed.join(", ")}` : "Alles aktualisiert");
}
function scheduleAuto(){
  clearTimeout(autoTimer);
  autoTimer = setTimeout(() => { if (document.visibilityState === "visible") refreshAll({quiet:true}); else scheduleAuto(); }, AUTO_REFRESH_MIN*60*1000);
}
function stampRefresh(){
  if (!lastRefresh) return;
  const next = new Date(lastRefresh.getTime() + AUTO_REFRESH_MIN*60*1000), f = d => d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});

function entriesByDay(){
  const map = {}; const add = (d, e) => (map[d] ||= []).push(e);
  for (const d of (state.data.briefing.deadlines||[])) add(d.date, {kind:"deadline", title:d.text, project:d.project});
  for (const [key, rec] of Object.entries(state.items)){
    if (rec.state === "snoozed" && rec.until) add(rec.until, {kind:"wv", title:rec.text, project:rec.project, key});
  }
  for (const [id, ev] of Object.entries(state.events)){
    if (!ev || !ev.date) continue;
    let d = pd(ev.date); const last = pd(ev.endDate && ev.endDate >= ev.date ? ev.endDate : ev.date); let guard = 0;
    do { add(iso(d), {kind:"own", id, title:ev.title, time: ev.allDay ? "ganzt." : (iso(d)===ev.date ? (ev.time||"") : "…"), project:ev.project, note:ev.note}); d = addDays(d,1); guard++; } while (d <= last && guard < 62);
  }
  const mk = `${state.cal.y}-${state.cal.m}`;
  for (const ev of (state.outlook.byMonth[mk] || [])){
    let d = pd(ev.startDate); const end = pd(ev.endDate);
    const last = ev.allDay ? addDays(end, -1) : end;
    let guard = 0;
    do { add(iso(d), {kind:"event", title:ev.subject, time: ev.allDay ? "ganzt." : (iso(d)===ev.startDate ? ev.startTime : "…"), link:ev.link}); d = addDays(d,1); guard++; } while (d <= last && guard < 62);
  }
  const order = {event:0, own:0, deadline:1, wv:2};
  for (const k in map) map[k].sort((a,b)=> order[a.kind]-order[b.kind] || String(a.time||"").localeCompare(String(b.time||"")));
  return map;
}

/* Outlook via the viewer's Microsoft 365 connector */
let mcp = null, perms = null;
const hiddenEvent = subj => (state.data?.calendarHide || []).some(h => h && String(subj||"").includes(h));
function collectObjects(p, out){
  if (p == null) return;
  if (typeof p === "string"){ scanJSON(p, out); return; }
  if (Array.isArray(p)){ p.forEach(x => collectObjects(x, out)); return; }
  if (typeof p === "object"){
    if (p.subject !== undefined || p.nextOffset !== undefined) out.push(p);
    for (const v of Object.values(p)) if (v && (typeof v === "object" || (typeof v === "string" && v.trim().startsWith("{")))) collectObjects(v, out);
  }
}
function scanJSON(s, out){
  let depth=0, start=-1, inStr=false, escp=false;
  for (let i=0;i<s.length;i++){
    const c = s[i];
    if (inStr){ if (escp) escp=false; else if (c==="\\") escp=true; else if (c==='"') inStr=false; continue; }
    if (c==='"') inStr=true;
    else if (c==="{"){ if (depth===0) start=i; depth++; }
    else if (c==="}"){ depth--; if (depth===0 && start>=0){ try{ collectObjects(JSON.parse(s.slice(start,i+1)), out); }catch(e){} start=-1; } }
  }
}
async function callOutlook(input){
  const S = "Microsoft 365", T = "outlook_calendar_search"; let lastErr = null;
  const tries = [
    () => mcp.callTool(S, T, input),
    () => mcp.callTool({server:S, tool:T, input}),
    () => mcp.callTool({server:S, name:T, arguments:input}),
    async () => { const srv = await mcp.server(S); return srv[T](input); }
  ];
  for (const f of tries){
    try{ const r = await f(); if (r !== undefined) return r; }
    catch(e){ lastErr = e; const c = String((e && e.code) || ""); if (/not_granted|denied|rate_limited|tool_error|server_not_connected|cancelled/.test(c)) throw e; }
  }
  throw lastErr || new Error("Keine Antwort von Outlook");
}
function olStatus(){
  const pill = $("#olPill"), fix = $("#olFix"), o = state.outlook; pill.hidden = false;
  const n = Object.values(o.byMonth).reduce((a,l)=>a+(l?l.length:0),0);
  if (o.status==="ok"){ pill.className = "save ok"; pill.textContent = `Outlook verbunden · ${n} Termine`; fix.hidden = true; }
  else if (o.status==="loading"){ pill.className = "save"; pill.textContent = "Outlook wird geladen …"; }
  else if (o.status==="off"){ pill.className = "save local"; pill.textContent = "Outlook nicht freigegeben" + (o.detail ? ` (${o.detail})` : ""); fix.hidden = false; }
  else if (o.status==="error"){ pill.className = "save local"; pill.textContent = "Outlook-Fehler: " + (o.detail || "unbekannt"); fix.hidden = false; }
  else { pill.hidden = true; }
}
async function loadOutlook(){
  if (!mcp || state.outlook.status==="off") return;
  const {y, m} = state.cal, mk = `${y}-${m}`;
  if (state.outlook.byMonth[mk]) return;
  state.outlook.byMonth[mk] = [];
  state.outlook.status = "loading"; renderCalendar();
  const after = iso(addDays(new Date(y, m, 1), -7)), before = iso(addDays(new Date(y, m+1, 0), 8));
  const events = []; let offset = 0;
  try{
    for (let page=0; page<4; page++){
      const res = await callOutlook({query:"*", afterDateTime:after, beforeDateTime:before, limit:25, offset, order:"oldest"});
      const objs = []; collectObjects(res, objs); try{ console.info("outlook raw", typeof res, res && Object.keys(res)); }catch(e){}
      let next = null;
      for (const o of objs){
        if (o.nextOffset !== undefined && o.subject === undefined){ next = o.nextOffset; continue; }
        if (!o.subject || !o.start || o.isCancelled) continue;
        const sdt = String(o.start.dateTime||""), edt = String((o.end||o.start).dateTime||"");
        if (hiddenEvent(o.subject)) continue;
        events.push({subject:o.subject, startDate:sdt.slice(0,10), startTime:sdt.slice(11,16), endDate:edt.slice(0,10)||sdt.slice(0,10), allDay:!!o.isAllDay, link:o.webLink});
      }
      if (next == null || next === offset) break;
      offset = next;
    }
    const seen = new Set();
    state.outlook.byMonth[mk] = events.filter(e => { const k = e.subject+e.startDate+e.startTime; if (seen.has(k)) return false; seen.add(k); return true; });
    state.outlook.status = "ok";
  }catch(e){
    const code = e && (e.code || e.name);
    delete state.outlook.byMonth[mk];
    state.outlook.detail = [code, e && e.message].filter(Boolean).join(": ").slice(0,140);
    state.outlook.status = (/not_granted|denied|consent|server_not_connected|unauthorized|forbidden/i.test(String(code)+String(e && e.message))) ? "off" : "error";
    console.warn("outlook", e);
  }
  renderCalendar();
}

function openSnooze(btn){
  const key = btn.dataset.key, b = base(btn), cur = state.items[key];
  const opts = [["Morgen", iso(addDays(today0(),1))], ["Montag", nextMonday()], ["In 1 Woche", iso(addDays(today0(),7))], ["In 1 Monat", iso(addDays(today0(),30))]];
  pop.innerHTML = `<div class="eyebrow">Wiedervorlage</div>
    <div class="row">${opts.map(([l,d])=>`<button type="button" class="btn" data-wv="${d}">${l}<span class="muted mono" style="font-size:.72rem;margin-left:4px">${fmtD(d)}</span></button>`).join("")}</div>
    <label class="note" for="wvDate">Eigenes Datum</label>
    <input type="date" id="wvDate" min="${iso(addDays(today0(),1))}" value="${cur?.until || iso(addDays(today0(),7))}">
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-wv="cancel">Abbrechen</button><button type="button" class="btn primary" data-wv="custom">Speichern</button></div>`;
  pop.hidden = false;
  const r = btn.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  let left = Math.min(window.innerWidth - w - 16, Math.max(16, r.right - w));
  let top = r.bottom + 6; if (top + h > window.innerHeight - 16) top = Math.max(16, r.top - h - 6);
  pop.style.left = left + "px"; pop.style.top = top + "px";
  pop.querySelector("[data-wv]").focus();
  pop.onclick = e => {
    const v = e.target.closest("[data-wv]")?.dataset.wv; if (!v) return;
    if (v === "cancel"){ pop.hidden = true; btn.focus(); return; }
    const until = v === "custom" ? $("#wvDate").value : v;
    if (!until){ $("#wvDate").focus(); return; }
    pop.hidden = true;
    store.set(key, {...b, state:"snoozed", until, at:new Date().toISOString()});
    showToast(`Auf Wiedervorlage am ${fmtD(until)}`, () => cur ? store.set(key, cur) : store.remove(key));
  };
}
document.addEventListener("click", e => {
  if (!pop.hidden && !pop.contains(e.target) && !e.target.closest('[data-act="snooze"]')) pop.hidden = true;
  const lamp = e.target.closest(".lamp");
  if (lamp){
    const k = lamp.dataset.k;
    if (k==="deadline"){ $("#deadlines").scrollIntoView({behavior:"smooth",block:"center"}); return; }
    ui.status = ui.status===k ? null : k; ui.company="Alle"; renderProjects(); $("#grid").scrollIntoView({behavior:"smooth",block:"start"}); return;
  }
  const chip = e.target.closest(".chip");
  if (chip){
    if (chip.dataset.company !== undefined){ ui.company = chip.dataset.company; saveUI(); }
    if (chip.dataset.status !== undefined){ ui.status = ui.status===chip.dataset.status ? null : chip.dataset.status; }
    renderProjects(); return;
  }
  const day = e.target.closest(".day");
  if (day){ state.cal.sel = day.dataset.day; renderCalendar(); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act, key = a.dataset.key;
  if (act === "toggle") return; // handled on change
  if (act === "snooze"){ e.preventDefault(); if (!pop.hidden){ pop.hidden = true; return; } openSnooze(a); return; }
  if (act === "delete"){
    const prev = state.items[key];
    store.set(key, {...base(a), state:"deleted", at:new Date().toISOString()});
    showToast("Aufgabe gelöscht", () => prev ? store.set(key, prev) : store.remove(key)); return;
  }
  if (act === "unsnooze"){ const prev = state.items[key]; store.remove(key); showToast("Wiedervorlage aufgehoben", () => store.set(key, prev)); return; }
  if (act === "showWV"){ const d = pd(a.dataset.date); state.cal = {y:d.getFullYear(), m:d.getMonth(), sel:a.dataset.date}; renderCalendar(); loadOutlook(); $("#calendar").scrollIntoView({behavior:"smooth",block:"start"}); }
});
document.addEventListener("change", e => {
  const cb = e.target.closest('[data-act="toggle"]'); if (!cb) return;
  const key = cb.dataset.key, prev = state.items[key];
  if (cb.checked) store.set(key, {...base(cb), state:"done", at:new Date().toISOString()});
  else store.remove(key);
});
document.addEventListener("toggle", e => {
  const d = e.target; if (!d.matches || !d.matches("details[data-d]")) return;
  ui.open[d.dataset.d] = d.open; saveUI();
}, true);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !pop.hidden) pop.hidden = true; });
$("#sort").addEventListener("change", e=>{ ui.sort=e.target.value; saveUI(); renderProjects(); });
const shiftMonth = n => { const d = new Date(state.cal.y, state.cal.m + n, 1); state.cal.y = d.getFullYear(); state.cal.m = d.getMonth(); state.cal.sel = iso(d.getMonth()===today0().getMonth() && d.getFullYear()===today0().getFullYear() ? today0() : d); renderCalendar(); loadOutlook(); };
$("#olFix").onclick = async () => {
  try{
    if (perms && typeof perms.manage === "function"){ await perms.manage(); }
    else if (perms && typeof perms.request === "function"){ await perms.request(["mcp"]); }
  }catch(e){ showToast("Bitte im Artifact-Menü oben unter „Berechtigungen“ den Zugriff auf Microsoft 365 erlauben."); }
  try{ if (!mcp) mcp = await window.claude.use("mcp"); }catch(e){}
  state.outlook.status = "idle"; state.outlook.byMonth = {}; loadOutlook();
};
$("#calPrev").onclick = () => shiftMonth(-1);
$("#calNext").onclick = () => shiftMonth(1);
$("#calToday").onclick = () => { const t = today0(); state.cal = {y:t.getFullYear(), m:t.getMonth(), sel:iso(t)}; renderCalendar(); loadOutlook(); };

/* ---------- boot ---------- */
onRefresh("Projektdaten", loadData);
onRefresh("Outlook", async () => { if (!mcp){ try{ mcp = await window.claude?.use?.("mcp"); }catch(e){} } if (!mcp) return; state.outlook.byMonth = {}; if (state.outlook.status !== "off") state.outlook.status = "idle"; await loadOutlook(); if (state.outlook.status === "error") throw new Error("Outlook"); searchOutlook(); });
onRefresh("Eigene Termine", async () => {
  if (evStore.mode === "db" && evStore.col && typeof evStore.col.get === "function"){ const remote = readDocs(await evStore.col.get()); if (Object.keys(remote).length || !Object.keys(state.events).length) state.events = remote; }
  else if (evStore.mode !== "db") evStore.loadLocal();
});
onRefresh("Häkchen", async () => {
  if (store.mode === "db" && store.col && typeof store.col.get === "function"){ const snap = await store.col.get(); const remote = readDocs(snap); if (Object.keys(remote).length || !Object.keys(state.items).length) state.items = remote; }
  else if (store.mode !== "db") store.loadLocal();
});
$("#refreshBtn").onclick = () => refreshAll();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && lastRefresh && (Date.now() - lastRefresh) > AUTO_REFRESH_MIN*60*1000) refreshAll({quiet:true}); });
const qEl = $("#q");
qEl.addEventListener("input", () => { setQuery(qEl.value); renderAll(); searchOutlook(); });
qEl.addEventListener("keydown", e => { if (e.key === "Escape"){ qEl.value = ""; setQuery(""); renderAll(); searchOutlook(); } });
$("#qClear").onclick = () => { qEl.value = ""; setQuery(""); renderAll(); searchOutlook(); qEl.focus(); };
document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "");
  if ((e.key === "/" && !typing) || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k")){ e.preventDefault(); qEl.focus(); qEl.select(); }
});
document.addEventListener("click", e => {
  const j = e.target.closest("[data-jump]"); if (!j || !j.dataset.jump) return;
  ui.company = "Alle"; ui.status = null; renderProjects();
  const card = document.getElementById("p-" + j.dataset.jump); if (!card) return;
  card.scrollIntoView({behavior:"smooth", block:"start"}); card.classList.remove("flash"); void card.offsetWidth; card.classList.add("flash");
});
document.addEventListener("click", e => {
  const g = e.target.closest("[data-goto]"); if (!g) return;
  const d = pd(g.dataset.goto); state.cal = {y:d.getFullYear(), m:d.getMonth(), sel:g.dataset.goto}; renderCalendar(); loadOutlook();
  $("#calendar").scrollIntoView({behavior:"smooth", block:"start"});
});
loadData()
  .then(()=>{ lastRefresh = new Date(); stampRefresh(); scheduleAuto(); renderAll(); })
  .catch(()=>{ $("#headline").textContent = "Die Projektdaten konnten nicht geladen werden. Lade die Seite neu; hilft das nicht, bitte Claude, das Cockpit neu zu veröffentlichen."; });

(async () => {
  if (!window.claude || typeof window.claude.use !== "function"){ showSaveMode(); return; }
  try{
    const db = await window.claude.use("db");
    if (db){
      const col = db.collection("items");
      store.col = col; store.db = db; store.mode = "db";
      const localItems = {...state.items};
      let firstSnap = true;
      col.onSnapshot(snap => {
        const remote = readDocs(snap);
        if (firstSnap){
          firstSnap = false;
          // carry over anything ticked on this device before the shared store was available
          for (const [k, v] of Object.entries(localItems)) if (!remote[k]) { remote[k] = v; Promise.resolve().then(()=>store.ref(k).set(v)).catch(()=>{}); }
          try{ localStorage.removeItem("cockpit-items"); }catch(e){}
        }
        state.items = remote; renderAll();
      }, err => { console.warn("db snapshot", err); store.fallback(); });
      try{
        const ecol = db.collection("events"); evStore.col = ecol; evStore.db = db; evStore.mode = "db";
        const localEv = {...state.events}; let firstEv = true;
        ecol.onSnapshot(snap => {
          const remote = readDocs(snap);
          if (firstEv){ firstEv = false; for (const [k,v] of Object.entries(localEv)) if (!remote[k]){ remote[k] = v; Promise.resolve().then(()=>evStore.ref(k).set(v)).catch(()=>{}); } try{ localStorage.removeItem("cockpit-events"); }catch(e){} }
          state.events = remote; renderCalendar(); renderResults();
        }, err => { console.warn("events snapshot", err); evStore.mode = "local"; });
      }catch(e){ console.warn("events", e); }
    }
  }catch(e){ console.warn("db", e); store.mode = "local"; }
  showSaveMode();
  try{ perms = await window.claude.use("permissions"); }catch(e){ perms = null; }
  try{ mcp = await window.claude.use("mcp"); }catch(e){ mcp = null; state.outlook.detail = String(e && (e.code || e.message) || ""); }
  if (mcp) loadOutlook(); else { state.outlook.status = "off"; state.outlook.detail = state.outlook.detail || "Kalenderzugriff in dieser Ansicht nicht verfügbar"; renderCalendar(); }
})();
</script>
